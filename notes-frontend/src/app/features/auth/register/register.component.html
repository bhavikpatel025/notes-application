<div class="auth-container">
  <div class="auth-wrapper">
    <div class="auth-banner">
      <span class="material-symbols-outlined banner-icon">draw</span>
      <h2>Start Creating</h2>
      <p>Join Keep Notes today and never lose a great idea again.</p>
    </div>
    
    <div class="auth-content">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Sign up to get started with Keep Notes</p>
      </div>

      @if (error) {
        <div class="error-banner">{{ error }}</div>
      }

      <div class="social-login-container">
        <asl-google-signin-button type="standard" size="large" text="continue_with" style="width: 100%; display: flex; justify-content: center;"></asl-google-signin-button>
      </div>

      <div class="auth-divider">
        <span>or sign up with email</span>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="floating-group">
          <input type="text" id="fullName" formControlName="fullName" placeholder=" " autocomplete="name" />
          <label for="fullName">Full Name</label>
        </div>

        <div class="floating-group">
          <input type="email" id="email" formControlName="email" placeholder=" " autocomplete="email" />
          <label for="email">Email address</label>
        </div>
        
        <div class="floating-group">
          <input type="password" id="password" formControlName="password" placeholder=" " autocomplete="new-password" />
          <label for="password">Password</label>
        </div>

        <button type="submit" class="btn-submit" [disabled]="registerForm.invalid || isLoading">
          {{ isLoading ? 'Creating account...' : 'Create Account' }}
        </button>
      </form>

      <div class="auth-link-container">
        Already have an account? <a routerLink="/login">Sign in</a>
      </div>
    </div>
  </div>
</div>
